{% extends "base.html" %}
{% block title %}Notatka dnia{% endblock %}

{% block content %}
<div class="w-full">
    <div class="flex items-center gap-3 mb-6">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-ghost btn-sm">← Wróć</a>
        <h1 class="text-lg sm:text-xl font-bold">Notatka — {{ entry.date.strftime('%d.%m.%Y') }}</h1>
    </div>

    <div class="card bg-base-100">
        <div class="card-body gap-5 p-4 sm:p-8">
            <form method="POST" action="{{ url_for('entries.edit', entry_id=entry.id) }}">
                <div class="form-control" x-data="{ noteLen: {{ (entry.notes|length) if entry.notes else 0 }} }">
                    <label class="label">
                        <span class="label-text font-medium">Notatka</span>
                        <span class="label-text-alt text-base-content/40">opcjonalna · <span x-text="noteLen"></span>/{{ note_max }}</span>
                    </label>
                    <textarea name="notes" rows="3" maxlength="{{ note_max }}"
                              @input="noteLen = $event.target.value.length"
                              class="textarea textarea-bordered w-full resize-none"
                              placeholder="Widoczna w Terminalu pracy w tym dniu, np. wyszedłem na obiad">{{ entry.notes or '' }}</textarea>
                </div>
                <p class="text-xs text-base-content/50 mt-2">Pozostałe dane tego dnia rejestrujesz w terminalu pracy.</p>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn btn-primary px-10">Zapisz</button>
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-ghost">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
