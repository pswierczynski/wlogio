<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie — Wlogio</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-base-200 h-dvh sm:min-h-screen flex flex-col items-center justify-center px-4 py-2 sm:py-8">

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-[calc(100vw-2rem)]">
        {% for category, message in messages %}
        <div x-data="{ show: true }" x-show="show" x-cloak
             x-init="setTimeout(() => show = false, 4000)"
             class="alert {% if category == 'error' %}alert-error{% elif category == 'success' %}alert-success{% else %}alert-info{% endif %} shadow-lg flex flex-row items-center gap-2 py-3 px-4">
            <span class="text-sm flex-1">{{ message }}</span>
            <button @click="show = false" class="btn btn-ghost btn-xs shrink-0 self-center">✕</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div x-data="{
            activeTab: 'panel',
            password: '',
            error: false,
            loading: false,
            async verify() {
                this.loading = true;
                this.error = false;
                const r = await fetch('/terminal/verify-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: this.password})
                });
                this.loading = false;
                if (r.ok) {
                    window.location.href = '/terminal/';
                } else {
                    this.error = true;
                    this.password = '';
                }
            }
         }"
         class="w-full flex flex-col items-center justify-center gap-0">

        <div class="card bg-base-100 shadow-xl w-full max-w-md max-h-[calc(100dvh-1rem)] sm:max-h-none overflow-hidden">
            <div class="card-body gap-2 p-4 sm:gap-5 sm:p-8">

                <div class="text-center mb-1 sm:mb-2">
                    <div class="flex items-center justify-center gap-2 mb-0.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 sm:h-8 sm:w-8 text-primary" fill="none"
                             viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <span class="text-xl sm:text-2xl font-bold tracking-tight">wlogio</span>
                    </div>
                    <p class="text-base-content/60 text-xs sm:text-sm">Rejestr czasu pracy</p>
                </div>

                <div class="flex gap-1.5 bg-base-200 rounded-lg p-1 mb-2 sm:mb-3">
                    <button type="button"
                            @click="activeTab = 'panel'"
                            class="flex-1 py-2 rounded-md text-sm transition-colors"
                            :class="activeTab === 'panel' ? 'bg-base-100 border border-base-content font-medium' : 'border border-transparent text-base-content/50 font-normal'">
                        Panel pracy
                    </button>
                    <button type="button"
                            @click="activeTab = 'terminal'"
                            class="flex-1 py-2 rounded-md text-sm transition-colors"
                            :class="activeTab === 'terminal' ? 'bg-base-100 border border-base-content font-medium' : 'border border-transparent text-base-content/50 font-normal'">
                        Terminal pracy
                    </button>
                </div>

                <div class="min-h-[280px] sm:min-h-[300px] flex flex-col">

                    <div x-show="activeTab === 'panel'" x-cloak>
                        <form method="POST" action="{{ url_for('auth.login') }}" class="flex flex-col gap-3 sm:gap-4">
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Adres email</span></label>
                                <input type="email" name="email" required autocomplete="email"
                                       class="input input-bordered w-full" placeholder="twoj@email.com"/>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Hasło</span></label>
                                <input type="password" name="password" required autocomplete="current-password"
                                       class="input input-bordered w-full" placeholder="••••••••"/>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" name="remember" class="checkbox checkbox-primary checkbox-sm"/>
                                <span class="text-sm">Zapamiętaj mnie</span>
                            </div>
                            <button type="submit" class="btn btn-primary w-full">Zaloguj się</button>
                        </form>

                        <div class="text-center text-sm mt-3 sm:mt-4">
                            Nie masz konta?
                            <a href="{{ url_for('auth.register') }}" class="link link-primary font-medium">
                                Zarejestruj się
                            </a>
                        </div>
                    </div>

                    <div x-show="activeTab === 'terminal'" x-cloak class="flex-1 flex flex-col justify-center">
                        <div class="form-control">
                            <label class="label"><span class="label-text font-medium">Hasło terminala</span></label>
                            <input type="password" x-model="password"
                                   @keydown.enter="verify()"
                                   class="input input-bordered w-full"
                                   :class="error ? 'input-error' : ''"
                                   placeholder="••••••••"/>
                            <div x-show="error" x-cloak class="label">
                                <span class="label-text-alt text-error">Nieprawidłowe hasło</span>
                            </div>
                        </div>
                        <button type="button" @click="verify()" :disabled="loading"
                                class="btn btn-primary w-full mt-3 sm:mt-4">
                            <span x-show="!loading">Wejdź do terminala</span>
                            <span x-show="loading" x-cloak class="loading loading-spinner loading-sm"></span>
                        </button>
                    </div>

                </div>

            </div>
        </div>

    </div>

</body>
</html>
