<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja — Wlogio</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Logo Wlogio (wordmark) — kolor dziedziczony z tekstu */
        .wlogio-logo{display:inline-block;aspect-ratio:3397/1040;background:currentColor;
            -webkit-mask:url("{{ url_for('static', filename='img/wlogio-logo.svg') }}") left center/contain no-repeat;
            mask:url("{{ url_for('static', filename='img/wlogio-logo.svg') }}") left center/contain no-repeat;}
        [x-cloak]{display:none!important}

        /* Zmiana koloru primary z niebieskiego (#4a00ff) na #1A1A19 */
        .btn-primary { background-color: #1A1A19; border-color: #1A1A19; color: #ffffff; }
        .btn-primary:hover { background-color: #000000; border-color: #000000; }
        .text-primary { color: #1A1A19; }
        .link-primary { color: #1A1A19; }
        .link-primary:hover { color: #000000; }
        .badge-primary { background-color: #1A1A19; border-color: #1A1A19; color: #fff; }
        .checkbox-primary:checked { background-color: #1A1A19; border-color: #1A1A19; }
        .radio-primary:checked { background-color: #1A1A19; border-color: #1A1A19; }

        /* Komunikaty (alert) — zawsze szare, bez wariantów czerwony/niebieski/zielony/żółty */
        .alert-error, .alert-success, .alert-info, .alert-warning {
            background-color: oklch(var(--b3));
            border-color: oklch(var(--b3));
            color: oklch(var(--bc));
        }
    </style>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center">

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm">
        {% for category, message in messages %}
        <div x-data="{ show: true }" x-show="show" x-cloak
             x-init="setTimeout(() => show = false, 4000)"
             class="alert {% if category == 'error' %}alert-error{% elif category == 'success' %}alert-success{% else %}alert-info{% endif %} shadow-lg">
            <span class="text-sm">{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="card bg-base-100 shadow-xl w-full max-w-md mx-4">
        <div class="card-body gap-6">
            <div class="text-center">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <span class="wlogio-logo h-8" role="img" aria-label="Wlogio"></span>
                </div>
                <p class="text-base-content/60 text-sm">Utwórz nowe konto</p>
            </div>

            <form method="POST" class="flex flex-col gap-4" x-data="{ accountType: 'individual', companySize: 'small' }">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Typ konta</span>
                    </label>
                    <div class="flex gap-2">
                        <label class="btn flex-1" :class="accountType === 'individual' ? 'btn-neutral' : 'btn-outline'">
                            <input type="radio" name="account_type" value="individual" class="hidden" x-model="accountType"/>
                            Indywidualne
                        </label>
                        <label class="btn flex-1" :class="accountType === 'company' ? 'btn-neutral' : 'btn-outline'">
                            <input type="radio" name="account_type" value="company" class="hidden" x-model="accountType"/>
                            Firmowe
                        </label>
                    </div>
                </div>

                <div class="form-control" x-show="accountType === 'company'" x-cloak>
                    <label class="label">
                        <span class="label-text font-medium">Wielkość firmy</span>
                    </label>
                    <div class="flex gap-2">
                        <label class="btn flex-1 h-auto min-h-12 py-2 flex-col gap-0 normal-case" :class="companySize === 'small' ? 'btn-neutral' : 'btn-outline'">
                            <input type="radio" name="company_size" value="small" class="hidden" x-model="companySize" :disabled="accountType !== 'company'"/>
                            <span>Mała</span><span class="text-xs font-normal opacity-70">do 10 pracowników</span>
                        </label>
                        <label class="btn flex-1 h-auto min-h-12 py-2 flex-col gap-0 normal-case" :class="companySize === 'medium' ? 'btn-neutral' : 'btn-outline'">
                            <input type="radio" name="company_size" value="medium" class="hidden" x-model="companySize" :disabled="accountType !== 'company'"/>
                            <span>Średnia</span><span class="text-xs font-normal opacity-70">do 50 pracowników</span>
                        </label>
                        <label class="btn flex-1 h-auto min-h-12 py-2 flex-col gap-0 normal-case" :class="companySize === 'large' ? 'btn-neutral' : 'btn-outline'">
                            <input type="radio" name="company_size" value="large" class="hidden" x-model="companySize" :disabled="accountType !== 'company'"/>
                            <span>Duża</span><span class="text-xs font-normal opacity-70">do 100 pracowników</span>
                        </label>
                    </div>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium" x-text="accountType === 'company' ? 'Nazwa firmy' : 'Imię i nazwisko'"></span>
                        <span class="label-text-alt text-base-content/40" x-show="accountType !== 'company'">opcjonalne</span>
                    </label>
                    <input type="text" name="name" autocomplete="name"
                           :required="accountType === 'company'"
                           class="input input-bordered w-full"
                           :placeholder="accountType === 'company' ? 'Nazwa Sp. z o.o.' : 'Jan Kowalski'"/>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Adres email</span>
                    </label>
                    <input type="email" name="email" required autocomplete="email"
                           class="input input-bordered w-full"
                           placeholder="twoj@email.com"/>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Hasło</span>
                        <span class="label-text-alt text-base-content/40">min. 6 znaków</span>
                    </label>
                    <input type="password" name="password" required autocomplete="new-password"
                           class="input input-bordered w-full"
                           placeholder="••••••••"/>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Powtórz hasło</span>
                    </label>
                    <input type="password" name="password2" required autocomplete="new-password"
                           class="input input-bordered w-full"
                           placeholder="••••••••"/>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Hasło do Terminalu pracy</span>
                        <span class="label-text-alt text-base-content/40">inne niż do panelu</span>
                    </label>
                    <input type="password" name="terminal_password" required autocomplete="new-password"
                           class="input input-bordered w-full"
                           placeholder="••••••••"/>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Powtórz hasło do Terminalu</span>
                    </label>
                    <input type="password" name="terminal_password2" required autocomplete="new-password"
                           class="input input-bordered w-full"
                           placeholder="••••••••"/>
                </div>

                <button type="submit" class="btn btn-primary w-full">
                    Zarejestruj się
                </button>
            </form>

            <div class="divider text-xs text-base-content/40">lub</div>

            <div class="text-center text-sm">
                Masz już konto?
                <a href="{{ url_for('auth.login') }}" class="link link-primary font-medium">
                    Zaloguj się
                </a>
            </div>
        </div>
    </div>

</body>
</html>
